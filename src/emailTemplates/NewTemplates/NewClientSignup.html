<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <!-- Tells clients this email ships BOTH themes, so they apply our palettes instead of auto-inverting -->
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>New Client Signed Up</title>
  <!--[if mso]>
  <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
  <![endif]-->

  <!-- =====================================================================
       RESPONSIVE BLOCK
       Kept in its OWN <style> tag on purpose: Gmail discards an entire <style> block
       if it dislikes any selector in it (e.g. the Outlook [data-ogsb] hooks below).
       Isolating the media queries means the responsive rules survive even if the
       theme block gets dropped.
       ===================================================================== -->
  <style type="text/css">
    @media only screen and (max-width: 620px) {

      /* ---- outer frame ---- */
      .wrap-outer {
        padding: 16px 8px !important;
      }

      .main-card {
        width: 100% !important;
        border-radius: 18px !important;
      }

      /* ---- logo ---- */
      .sec-logo {
        padding: 28px 0 22px !important;
      }

      .logo-pill {
        padding: 10px 24px !important;
      }

      .sec-logo-sep {
        padding: 24px 16px 0 !important;
      }

      /* ---- header ---- */
      .sec-header {
        padding: 0 16px !important;
      }

      .h1 {
        font-size: 30px !important;
        line-height: 1.2 !important;
        letter-spacing: 0 !important;
      }

      .subtitle {
        margin-top: 10px !important;
        font-size: 18px !important;
        line-height: 1.4 !important;
      }

      /* ---- receipt ---- */
      .sec-receipt {
        padding: 32px 12px 48px !important;
      }

      .receipt-pad {
        padding: 44px 14px 32px !important;
      }

      .details-wrap {
        margin-bottom: 16px !important;
      }

      .details-title {
        font-size: 22px !important;
      }

      .white-card {
        border-radius: 18px !important;
      }

      .card-pad {
        padding: 20px 16px 0 !important;
        border-radius: 18px !important;
      }

      .row-pad {
        padding-top: 14px !important;
      }

      .icon-cell {
        width: 64px !important;
      }

      .icon-bg {
        width: 56px !important;
        height: 56px !important;
      }

      .icon-img {
        width: 20px !important;
        height: 20px !important;
        margin-top: 13px !important;
        margin-right: 9px !important;
      }

      .row-label {
        font-size: 14px !important;
      }

      .row-value {
        font-size: 16px !important;
        line-height: 22px !important;
      }

      .btn-cell {
        padding: 14px 26px !important;
      }

      .btn {
        font-size: 15px !important;
        letter-spacing: 0.5px !important;
      }

      /* ---- footer ---- */
      .sec-footer {
        padding: 24px 16px !important;
      }

      .footer-sep {
        padding-bottom: 28px !important;
      }

      .footer-links {
        margin-bottom: 14px !important;
        font-size: 13px !important;
        line-height: 20px !important;
      }

      .brand-name {
        margin-bottom: 24px !important;
        font-size: 20px !important;
      }
    }

    /* small phones (<= 400px, e.g. 360px Androids, iPhone SE) */
    @media only screen and (max-width: 400px) {
      .h1 {
        font-size: 26px !important;
      }

      .subtitle {
        font-size: 16px !important;
      }

      .icon-cell {
        width: 56px !important;
      }

      .icon-bg {
        width: 48px !important;
        height: 48px !important;
      }

      .icon-img {
        width: 18px !important;
        height: 18px !important;
        margin-top: 11px !important;
        margin-right: 8px !important;
      }

      .btn-cell {
        padding: 12px 20px !important;
      }

      .btn {
        font-size: 14px !important;
      }

      .footer-links {
        font-size: 12px !important;
      }
    }
  </style>

  <!-- THEME / RESET BLOCK -->
  <style type="text/css">
    :root {
      color-scheme: light dark;
      supported-color-schemes: light dark;
    }

    body,
    table,
    td,
    p,
    a,
    h1,
    h2,
    div,
    span {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
    }

    body,
    table,
    td,
    a {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }

    table,
    td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }

    img {
      -ms-interpolation-mode: bicubic;
      border: 0;
      outline: none;
      text-decoration: none;
    }

    /* =====================================================================
       THEMES
       LIGHT = the inline styles in the markup (original colours + gradient).
       DARK  = the palette below, declared twice because clients use different hooks:
         1. @media (prefers-color-scheme: dark) -> Apple Mail, iOS Mail, Outlook.com /
            new Outlook, Samsung Mail, Thunderbird, Yahoo, most webmail
         2. [data-ogsb] / [data-ogsc]           -> Outlook desktop + Outlook iOS/Android
         Gmail iOS/Android ignore both and auto-invert. Gmail inverts SOLID colours but skips
         gradients and images, so:
           - the card gradient = SOLID base + LOW-ALPHA gradient overlay on a child cell
           - text on the peach receipt IMAGE sits in a solid peach chip (inverts with its text)
           - the button base is #000010, not #000000 (Gmail iOS inverts pure black to white)

       DARK PALETTE
         page                #121212
         card                #1A1410 (dark brown-black) + warm overlay to #2B2517
         white surfaces      #26241F
         divider lines       #3A362C
         headings / values   #F5F1E8
         secondary / labels  #B5AEA0
         small print         #C9C3B6
         button              unchanged (#E8D1AB on #000010)
         peach receipt img   unchanged -> text on it stays dark (.on-peach)
       ===================================================================== */

    /* 1 ---- standards-based dark mode ---- */
    @media (prefers-color-scheme: dark) {

      body,
      .body-bg {
        background-color: #121212 !important;
        color: #D8D2C4 !important;
      }

      .main-card {
        background-color: #1A1410 !important;
      }

      .card-overlay {
        background-image: linear-gradient(143deg, rgba(43, 37, 23, 0) 22.58%, rgba(43, 37, 23, 1) 188.59%) !important;
      }

      .white-card,
      .white-card td,
      .logo-pill {
        background-color: #26241F !important;
      }

      .white-card td.divider-line {
        background-color: #3A362C !important;
      }

      /* the peach receipt is an image: it stays light, so its text stays dark */
      .panel-peach {
        background-color: #FEF0D8 !important;
      }

      .on-peach {
        color: #000010 !important;
      }

      .text-black {
        color: #F5F1E8 !important;
      }

      .secondary-text,
      .meta-label {
        color: #B5AEA0 !important;
      }

      .footer-text {
        color: #C9C3B6 !important;
      }

      .force-black-bg {
        background-color: #000010 !important;
      }

      .force-accent-text {
        color: #E8D1AB !important;
      }
    }

    /* 2 ---- Outlook (desktop + mobile + Outlook.com) ---- */
    [data-ogsb] body,
    [data-ogsb] .body-bg {
      background-color: #121212 !important;
    }

    [data-ogsc] body,
    [data-ogsc] .body-bg {
      color: #D8D2C4 !important;
    }

    [data-ogsb] .main-card {
      background-color: #1A1410 !important;
    }

    [data-ogsb] .card-overlay {
      background-image: linear-gradient(143deg, rgba(43, 37, 23, 0) 22.58%, rgba(43, 37, 23, 1) 188.59%) !important;
    }

    [data-ogsb] .white-card,
    [data-ogsb] .white-card td,
    [data-ogsb] .logo-pill {
      background-color: #26241F !important;
    }

    [data-ogsb] .white-card td.divider-line {
      background-color: #3A362C !important;
    }

    [data-ogsb] .panel-peach {
      background-color: #FEF0D8 !important;
    }

    [data-ogsc] .on-peach {
      color: #000010 !important;
    }

    [data-ogsc] .text-black {
      color: #F5F1E8 !important;
    }

    [data-ogsc] .secondary-text,
    [data-ogsc] .meta-label {
      color: #B5AEA0 !important;
    }

    [data-ogsc] .footer-text {
      color: #C9C3B6 !important;
    }

    [data-ogsb] .force-black-bg {
      background-color: #000010 !important;
    }

    [data-ogsc] .force-accent-text {
      color: #E8D1AB !important;
    }
  </style>
</head>

<body class="body-bg"
  style="margin: 0; padding: 0; width: 100%; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #F7F7F7; color: #484848; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">
  <table class="body-bg" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F7F7F7"
    style="background-color: #F7F7F7;">
    <tr>
      <td class="wrap-outer" align="center" style="padding: 40px 20px;">

        <!-- Outlook (Windows) ignores max-width; this ghost table caps it at 600px -->
        <!--[if mso]>
        <table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td>
        <![endif]-->

        <!-- LAYER 1: SOLID colour only (no gradient on this element, so Gmail iOS can invert it with its text) -->
        <table class="main-card" role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
          bgcolor="#FFFCF6"
          style="width: 100%; max-width: 600px; background-color: #FFFCF6; border: 1px solid rgba(232, 209, 171, 0.3); border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border-collapse: separate;">
          <tr>
            <!-- LAYER 2: the gradient as a LOW-ALPHA overlay (stronger colour, alpha <= ~0.2 on the card).
                 Over #FFFCF6 this is identical to linear-gradient(143deg, #FFFCF6 22.58%, #F8E5C7 188.59%),
                 but when Gmail inverts the base it only adds a faint warm tint instead of a muddy tan. -->
            <td class="card-overlay"
              style="padding: 0; background-image: linear-gradient(143deg, rgba(239,199,137,0) 22.58%, rgba(239,199,137,0.43) 188.59%);">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                <!-- Beige Logo -->
                <tr>
                  <td class="sec-logo" align="center" style="padding: 40px 0 36px;">
                    <div class="logo-pill"
                      style="display: inline-block; border: 1px solid rgba(232, 209, 171, 0.4); padding: 12px 32px; border-radius: 100px; background-color: #FFFFFF; box-shadow: 0 8px 24px 0 rgba(149, 157, 165, 0.20);">
                      <img src="https://beige-web-prod.s3.us-east-1.amazonaws.com/beige/assets/logos/beige_logo_vb.png"
                        alt="Beige" width="110" style="display: block; border: 0; width: 110px; max-width: 110px;">
                    </div>
                    <div class="sec-logo-sep" style="padding: 36px 40px 0;">
                      <img
                        src="https://beige-web-prod.s3.us-east-1.amazonaws.com/beige/assets/email_assets/HorizontalSeparator.png"
                        alt="" width="100%" style="display: block; border: 0; width: 100%; max-width: 100%;">
                    </div>
                  </td>
                </tr>

                <!-- Header -->
                <tr>
                  <td class="sec-header" style="padding: 0 40px; text-align: center;">
                    <h1 class="text-black h1"
                      style="margin: 0; color: #000000; font-size: 50px; font-weight: 500; letter-spacing: 1px; line-height: 1.2;">
                      New Client Signed Up
                    </h1>
                    <p class="secondary-text subtitle"
                      style="margin: 16px 0 0; font-size: 30px; color: #707070; line-height: 1.3;">
                      A new user has registered on the Beige platform.
                    </p>
                  </td>
                </tr>

                <!-- Receipt -->
                <tr>
                  <td class="sec-receipt" style="padding: 53px 40px 60px;">
                    <table role="presentation" align="center" border="0" cellpadding="0" cellspacing="0" width="100%">
                      <tr>
                        <td class="receipt-bg" align="center"
                          style="padding: 0; background-image: url('https://beige-web-prod.s3.us-east-1.amazonaws.com/beige/assets/email_assets/ScallopTopReceiptBg.png'); background-repeat: no-repeat; background-position: top center; background-size: 100% auto; border-radius: 0 0 48px 48px;">

                          <!-- Client Details -->
                          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                            <tr>
                              <td class="receipt-pad" align="center" style="padding: 60px 30px 40px;">

                                <!-- "Client Details" chip on the peach image (#FEF0D8 = flat colour of the image) -->
                                <table class="details-wrap" role="presentation" border="0" cellpadding="0"
                                  cellspacing="0" align="center" style="margin: 0 auto 25px;">
                                  <tr>
                                    <td class="panel-peach" align="center" bgcolor="#FEF0D8"
                                      style="background-color: #FEF0D8; border-radius: 20px; padding: 6px 24px;">
                                      <h2 class="on-peach details-title"
                                        style="margin: 0; font-size: 30px; font-weight: 600; color: #000000;">
                                  Client Details</h2>
                                    </td>
                                  </tr>
                                </table>

                                <table class="white-card" role="presentation" border="0" cellpadding="0" cellspacing="0"
                                  width="100%" bgcolor="#FFFFFF"
                                  style="background-color: #FFFFFF; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-collapse: separate;">
                                  <tr>
                                    <td class="card-pad" bgcolor="#FFFFFF"
                                      style="padding: 30px 30px 0; background-color: #FFFFFF; border-radius: 24px;">
                                      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                        border="0">

                                        <tr>
                                          <td bgcolor="#FFFFFF" style="background-color: #FFFFFF;">
                                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                              border="0">
                                              <tr>
                                                <td class="icon-cell" width="123" bgcolor="#FFFFFF"
                                                  style="width: 123px; background-color: #FFFFFF;">
                                                  <div class="icon-bg"
                                                    style="width: 111px; height: 111px; background-image: url('https://beige-web-prod.s3.us-east-1.amazonaws.com/beige/assets/email_assets/IconBg.png'); background-size: cover; background-repeat: no-repeat; background-position: center; text-align: center;">
                                                    <img class="icon-img"
                                                      src="https://beige-web-prod.s3.us-east-1.amazonaws.com/beige/assets/email_assets/User.svg"
                                                      width="40" height="40" alt=""
                                                      style="margin-top: 25px; margin-right: 18px; display: inline-block; border: 0;">
                                                  </div>
                                                </td>
                                                <td bgcolor="#FFFFFF"
                                                  style="background-color: #FFFFFF; word-break: break-word; overflow-wrap: anywhere;">
                                                  <p class="meta-label row-label"
                                                    style="margin: 0; font-size: 16px; color: #525252; font-weight: 300;">
                                                    Name</p>
                                                  <p class="text-black row-value"
                                                    style="margin: 2px 0 0; font-size: 18px; font-weight: 600; color: #000000;">
                                                    {{name}}</p>
                                                </td>
                                              </tr>
                                            </table>
                                          </td>
                                        </tr>
                                        <tr>
                                          <td class="divider-line" height="1" bgcolor="#EDEDED"
                                            style="background-color: #EDEDED; padding: 0; line-height: 1px; font-size: 1px;">
                                            &nbsp;</td>
                                        </tr>
                                        <tr>
                                          <td class="row-pad" bgcolor="#FFFFFF"
                                            style="padding: 20px 0 0; background-color: #FFFFFF;">
                                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                              border="0">
                                              <tr>
                                                <td class="icon-cell" width="123" bgcolor="#FFFFFF"
                                                  style="width: 123px; background-color: #FFFFFF;">
                                                  <div class="icon-bg"
                                                    style="width: 111px; height: 111px; background-image: url('https://beige-web-prod.s3.us-east-1.amazonaws.com/beige/assets/email_assets/IconBg.png'); background-size: cover; background-repeat: no-repeat; background-position: center; text-align: center;">
                                                    <img class="icon-img"
                                                      src="https://beige-web-prod.s3.us-east-1.amazonaws.com/beige/assets/email_assets/Email.svg"
                                                      width="40" height="40" alt=""
                                                      style="margin-top: 25px; margin-right: 18px; display: inline-block; border: 0;">
                                                  </div>
                                                </td>
                                                <td bgcolor="#FFFFFF"
                                                  style="background-color: #FFFFFF; word-break: break-word; overflow-wrap: anywhere;">
                                                  <p class="meta-label row-label"
                                                    style="margin: 0; font-size: 16px; color: #525252; font-weight: 300;">
                                                    Email</p>
                                                  <p class="text-black row-value"
                                                    style="margin: 2px 0 0; font-size: 18px; font-weight: 600; color: #000000;">
                                                    {{email}}</p>
                                                </td>
                                              </tr>
                                            </table>
                                          </td>
                                        </tr>
                                        <tr>
                                          <td class="divider-line" height="1" bgcolor="#EDEDED"
                                            style="background-color: #EDEDED; padding: 0; line-height: 1px; font-size: 1px;">
                                            &nbsp;</td>
                                        </tr>

                                        <!-- Contact Row -->
                                        <tr>
                                          <td class="row-pad" bgcolor="#FFFFFF"
                                            style="padding: 20px 0 0; background-color: #FFFFFF;">
                                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                              border="0">
                                              <tr>
                                                <td class="icon-cell" width="123" bgcolor="#FFFFFF"
                                                  style="width: 123px; background-color: #FFFFFF;">
                                                  <div class="icon-bg"
                                                    style="width: 111px; height: 111px; background-image: url('https://beige-web-prod.s3.us-east-1.amazonaws.com/beige/assets/email_assets/IconBg.png'); background-size: cover; background-repeat: no-repeat; background-position: center; text-align: center;">
                                                    <img class="icon-img"
                                                      src="https://beige-web-prod.s3.us-east-1.amazonaws.com/beige/assets/email_assets/contactphone.svg"
                                                      width="40" height="40" alt=""
                                                      style="margin-top: 25px; margin-right: 18px; display: inline-block; border: 0;">
                                                  </div>
                                                </td>
                                                <td bgcolor="#FFFFFF"
                                                  style="background-color: #FFFFFF; word-break: break-word; overflow-wrap: anywhere;">
                                                  <p class="meta-label row-label"
                                                    style="margin: 0; font-size: 16px; color: #525252; font-weight: 300;">
                                                    Contact Number</p>
                                                  <p class="text-black row-value"
                                                    style="margin: 2px 0 0; font-size: 18px; font-weight: 600; color: #000000;">
                                                    {{phone_number}}</p>
                                                </td>
                                              </tr>
                                            </table>
                                          </td>
                                        </tr>
                                        <tr>
                                          <td class="divider-line" height="1" bgcolor="#EDEDED"
                                            style="background-color: #EDEDED; padding: 0; line-height: 1px; font-size: 1px;">
                                            &nbsp;</td>
                                        </tr>

                                        <!-- Instagram Row -->
                                        <tr>
                                          <td class="row-pad" bgcolor="#FFFFFF"
                                            style="padding-top: 20px; background-color: #FFFFFF;">
                                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                              border="0">
                                              <tr>
                                                <td class="icon-cell" width="123" bgcolor="#FFFFFF"
                                                  style="width: 123px; background-color: #FFFFFF;">
                                                  <div class="icon-bg"
                                                    style="width: 111px; height: 111px; background-image: url('https://beige-web-prod.s3.us-east-1.amazonaws.com/beige/assets/email_assets/IconBg.png'); background-size: cover; background-repeat: no-repeat; background-position: center; text-align: center;">
                                                    <img class="icon-img"
                                                      src="https://beige-web-prod.s3.us-east-1.amazonaws.com/beige/assets/email_assets/Instagram.png"
                                                      width="40" height="40" alt=""
                                                      style="margin-top: 25px; margin-right: 18px; display: inline-block; border: 0;">
                                                  </div>
                                                </td>
                                                <td bgcolor="#FFFFFF"
                                                  style="background-color: #FFFFFF; word-break: break-word; overflow-wrap: anywhere;">
                                                  <p class="meta-label row-label"
                                                    style="margin: 0; font-size: 16px; color: #525252; font-weight: 300;">
                                                    Instagram</p>
                                                  <p class="text-black row-value"
                                                    style="margin: 2px 0 0; font-size: 18px; font-weight: 600; color: #000000;">
                                                    {{instagram}}</p>
                                                </td>
                                              </tr>
                                            </table>
                                          </td>
                                        </tr>
                                      </table>
                                    </td>
                                  </tr>
                                </table>
                              </td>
                            </tr>
                          </table>

                          <!-- Floating button -->
                          <table role="presentation" border="0" cellpadding="0" cellspacing="0" align="center"
                            style="margin-bottom: -30px;">
                            <tr>
                              <td class="force-black-bg btn-cell" align="center" bgcolor="#000010"
                                style="background-color: #000010; border-radius: 100px; padding: 18px 40px; box-shadow: 0 10px 20px rgba(0,0,0,0.15);">
                                <a class="force-accent-text btn" href="{{loginUrl}}" target="_blank"
                                  style="font-size: 18px; font-weight: 600; color: #E8D1AB; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; line-height: 1.2; display: inline-block; white-space: nowrap;">
                                  Open Admin Panel &rarr;
                                </a>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Footer -->
                <tr>
                  <td class="sec-footer" align="center" style="padding: 30px 40px;">
                    <div class="footer-sep" style="padding-bottom: 48px;">
                      <img
                        src="https://beige-web-prod.s3.us-east-1.amazonaws.com/beige/assets/email_assets/HorizontalSeparator.png"
                        alt="" width="100%" style="display: block; border: 0; width: 100%; max-width: 100%;">
                    </div>
                    <p class="footer-text footer-links" style="margin: 0 0 20px; font-size: 16px; color: #3C3B3B;">
                      Help Center &nbsp;&bull;&nbsp; Term of Services &nbsp;&bull;&nbsp; Privacy Policy
                    </p>
                    <p class="text-black brand-name"
                      style="margin: 0 0 60px; color: #000000; font-size: 26px; font-weight: 600;">
                      Beige AI
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <!--[if mso]>
        </td></tr></table>
        <![endif]-->

      </td>
    </tr>
  </table>
</body>

</html>
